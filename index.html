/* Layout: near-black stage, optional GIF/video background, one 520px column in the middle:
   header (avatar + name block), YouTube card, Apple Music card, icon row, stats line. */
:root {
  --bg: #0a0a0a;
  --fg: #fff;
  --dim: rgba(255,255,255,.62);
  --faint: rgba(255,255,255,.2);
  --card: rgba(83,83,83,.78);
  --red: #e62235;
  --pink: #ff2d6f;
  --display: "Display", "Bebas Neue", Impact, "Arial Narrow", sans-serif;
  --ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--display); overflow-x: hidden; }
a, button, [role=button] { cursor: pointer; }

/* background (your GIF / video), darkened */
#bgWrap { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
#bgWrap img, #bgWrap video { position: absolute; inset: -3%; width: 106%; height: 106%; object-fit: cover; display: none; transition: transform .4s ease-out; }
#bgWrap::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,var(--shade, .4)); }

/* click to enter */
#enter { position: fixed; inset: 0; z-index: 60; background: #000; display: grid; place-items: center; transition: opacity .9s ease, visibility .9s; }
#enter.gone { opacity: 0; visibility: hidden; }
#enter span { font: 30px/1 var(--display); letter-spacing: .04em; color: #fff; animation: pulse 1.8s ease-in-out infinite; text-transform: lowercase; }
@keyframes pulse { 50% { opacity: .35; } }

.stage { position: relative; z-index: 1; min-height: 100%; display: grid; place-items: center;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px; perspective: 1200px; }
.col { width: 100%; max-width: 520px; display: grid; gap: 30px; transform-style: preserve-3d; transition: transform .3s ease-out; }
body:not(.in) .col { visibility: hidden; }
body.in .col > * { animation: up 1s cubic-bezier(.16,.84,.3,1) both; }
body.in .col > :nth-child(2) { animation-delay: .1s; } body.in .col > :nth-child(3) { animation-delay: .2s; }
body.in .col > :nth-child(4) { animation-delay: .3s; } body.in .col > :nth-child(5) { animation-delay: .4s; }
@keyframes up { from { opacity: 0; transform: translateY(26px); filter: blur(8px); } to { opacity: 1; transform: none; filter: blur(0); } }

/* header */
.head { display: flex; align-items: center; gap: 22px; }
.pfp { width: 150px; height: 150px; flex: none; background: center/140% no-repeat; border-radius: 50%; -webkit-mask: radial-gradient(circle, #000 58%, transparent 71%); mask: radial-gradient(circle, #000 58%, transparent 71%); filter: drop-shadow(0 0 18px rgba(255,255,255,.12));
  animation: float 6s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-6px); } }
.who { min-width: 0; flex: 1; display: grid; gap: 10px; }
.nameRow { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.name { margin: 0; filter: url(#grit); font: 64px/.85 var(--display); position: relative; white-space: nowrap; letter-spacing: .01em; }
.name .txt { position: relative; display: inline-block; }
.name .txt::before, .name .txt::after { content: attr(data-t); position: absolute; left: 0; top: 0; opacity: 0; pointer-events: none; }
.name .txt::before { color: var(--pink); clip-path: inset(18% 0 58% 0); animation: g1 3.6s infinite steps(1); }
.name .txt::after { color: #fff; clip-path: inset(60% 0 12% 0); animation: g2 3.6s infinite steps(1); }
@keyframes g1 { 0%,86%,100% { opacity: 0; transform: none; } 87% { opacity: 1; transform: translate(-5px,0); } 89% { opacity: 1; transform: translate(4px,1px); clip-path: inset(42% 0 36% 0); } 91% { opacity: 0; } }
@keyframes g2 { 0%,87%,100% { opacity: 0; transform: none; } 88% { opacity: 1; transform: translate(6px,0); } 90% { opacity: 1; transform: translate(-4px,0); } 92% { opacity: 0; } }
.specks i { position: absolute; background: var(--pink); animation: speck 2.6s infinite; }
@keyframes speck { 0%,100% { opacity: 0; } 35%,65% { opacity: 1; } }
.badges { display: flex; gap: 12px; }
.badge { position: relative; display: grid; }
.badge svg { width: 30px; height: 30px; fill: #fff; filter: drop-shadow(0 0 7px rgba(255,255,255,.7)); transition: transform .25s cubic-bezier(.3,1.7,.5,1); }
.badge:hover svg { transform: scale(1.18) rotate(-8deg); }
.tip { position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translate(-50%, 4px); background: #121212; border: 1px solid #2c2c2c;
  font: 600 12px/1 var(--ui); color: #fff; padding: 7px 9px; border-radius: 7px; white-space: nowrap; opacity: 0; pointer-events: none; transition: .18s; z-index: 5; }
.badge:hover .tip, .stat:hover .tip { opacity: 1; transform: translate(-50%, 0); }
.type { font-size: 26px; line-height: 1; min-height: 26px; letter-spacing: .01em; }
.type .cur { display: inline-block; width: 2px; height: 22px; background: #fff; margin-left: 3px; vertical-align: -2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.joined { font-size: 22px; line-height: 1; color: var(--dim); letter-spacing: .02em; }

/* YouTube card */
.yt { display: flex; gap: 20px; align-items: center; position: relative; text-decoration: none; color: inherit; min-width: 0; }
.ytPic { width: 130px; height: 130px; flex: none; border-radius: 28px; background: #222 center/cover no-repeat; transition: transform .35s cubic-bezier(.3,1.5,.5,1); }
.yt:hover .ytPic { transform: scale(1.05) rotate(-2deg); }
.ytName { font-size: 34px; line-height: 1; }
.subs { display: flex; align-items: center; gap: 9px; font-size: 24px; color: var(--dim); margin-top: 8px; }
.subs svg { width: 28px; height: 19px; fill: currentColor; }
.btn { display: inline-block; margin-top: 10px; background: var(--red); color: #fff; font: 24px/1 var(--display); padding: 6px 22px 5px; border-radius: 999px;
  letter-spacing: .02em; transition: transform .2s, box-shadow .2s; }
.yt:hover .btn { transform: translateY(-2px); box-shadow: 0 8px 24px -6px rgba(230,34,53,.9); }
.ytLbl { position: absolute; top: 4px; right: 0; display: flex; align-items: center; gap: 7px; font-size: 21px; color: var(--faint); }
.ytLbl svg { width: 30px; height: 21px; fill: currentColor; }

/* Apple Music card */
.am { background: var(--card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: 24px; padding: 18px;
  display: flex; gap: 18px; position: relative; font-family: var(--ui); overflow: hidden; }
.am::before { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 40%, rgba(255,255,255,.07) 50%, transparent 60%);
  transform: translateX(-100%); animation: sheen 6s ease-in-out infinite; pointer-events: none; }
@keyframes sheen { 0%,60% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
.cover { width: 140px; height: 140px; flex: none; border-radius: 12px; background: #f2f2f2 center/cover no-repeat; position: relative; overflow: hidden; }
.am.playing .cover { animation: beat .55s ease-in-out infinite alternate; }
@keyframes beat { to { transform: scale(1.025); } }
.am .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.song { font: 700 30px/1.15 var(--ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 10px; padding-right: 36px; }
.artist { font: 500 22px/1.3 var(--ui); color: rgba(255,255,255,.72); }
.am .row { margin-top: auto; display: flex; align-items: center; gap: 8px; }
.chip { background: rgba(0,0,0,.42); font: 700 17px/1 var(--ui); padding: 7px 10px; border-radius: 4px; }
.ctrls { margin-left: auto; display: flex; align-items: center; gap: 18px; }
.ctrls a { display: grid; transition: transform .2s; } .ctrls a:hover { transform: scale(1.1); }
.ctrls svg { width: 46px; height: 46px; }
.dots { display: flex; gap: 6px; } .dots i { width: 6px; height: 6px; border-radius: 50%; background: #fff; }
.play { width: 62px; height: 62px; border-radius: 50%; background: #fff; display: grid; place-items: center; border: 0; transition: transform .15s; }
.play:hover { transform: scale(1.08); }
.play svg { width: 24px; height: 24px; fill: #000; }
.amLogo { position: absolute; top: 16px; right: 16px; width: 30px; height: 30px; }
.prog { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: #fa2d48; transition: width .25s linear; }
.eq { display: none; gap: 3px; align-items: flex-end; height: 18px; } .am.playing .eq { display: flex; }
.eq i { width: 3px; background: #fa2d48; animation: eq .8s ease-in-out infinite; }
.eq i:nth-child(2) { animation-delay: .15s; } .eq i:nth-child(3) { animation-delay: .3s; } .eq i:nth-child(4) { animation-delay: .45s; }
@keyframes eq { 0%,100% { height: 4px; } 50% { height: 18px; } }

/* socials */
.icons { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; }
.icons a { display: grid; place-items: center; transition: transform .28s cubic-bezier(.3,1.7,.5,1), filter .28s; position: relative; }
.icons a:hover, .icons a:focus-visible { transform: translateY(-7px) scale(1.12); filter: drop-shadow(0 10px 16px rgba(255,255,255,.22)); outline: none; }
.icons svg { height: 64px; width: auto; }

.stats { display: flex; align-items: center; gap: 20px; font-size: 28px; }
.stats .sep { width: 2px; height: 32px; background: rgba(255,255,255,.28); }
.stat { position: relative; display: flex; align-items: center; gap: 12px; }
.stat svg { width: 38px; height: 38px; fill: #fff; }

/* pink sparkle trail */
.spark { position: fixed; z-index: 70; pointer-events: none; width: 10px; height: 10px; margin: -5px 0 0 -5px;
  background: radial-gradient(circle, #fff 0 18%, var(--pink) 40%, transparent 70%);
  clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
  animation: spark .8s ease-out forwards; }
@keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(.2) rotate(120deg); opacity: 0; } }

/* edit panel */
#editBtn { position: fixed; z-index: 30; right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  width: 42px; height: 42px; border-radius: 50%; border: 1px solid #2a2a2a; background: rgba(18,18,18,.85); color: #fff; font-size: 17px; opacity: .55; transition: opacity .2s; }
#editBtn:hover { opacity: 1; }
#panel { position: fixed; z-index: 31; left: 0; right: 0; bottom: 0; max-height: 82%; overflow: auto; background: #0d0d0d; border-top: 1px solid #262626;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  font: 500 14px/1.4 var(--ui); transform: translateY(100%); transition: transform .35s cubic-bezier(.2,.8,.2,1); }
#panel.open { transform: none; }
#panel h2 { margin: 0 0 4px; font: 28px/1 var(--display); }
#panel p { margin: 0 0 14px; color: #8a8a8a; font-size: 13px; max-width: 60ch; }
#panel .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
#panel label { display: grid; gap: 6px; background: #151515; border: 1px solid #242424; border-radius: 10px; padding: 10px; }
#panel small { color: #777; }
#panel input[type=file] { font-size: 12px; color: #aaa; max-width: 100%; }
#panel input[type=range] { width: 100%; }
#panel .close { margin-top: 14px; width: 100%; padding: 12px; border-radius: 10px; border: 0; background: #fff; color: #000; font: 700 14px var(--ui); }

@media (max-width: 560px) {
  .col { gap: 24px; }
  .head { gap: 14px; } .pfp { width: 108px; height: 108px; }
  .name { font-size: 50px; } .badge svg { width: 24px; height: 24px; } .type { font-size: 21px; min-height: 21px; } .joined { font-size: 18px; }
  .ytPic { width: 100px; height: 100px; border-radius: 22px; } .ytName { font-size: 28px; } .subs { font-size: 20px; } .btn { font-size: 20px; } .ytLbl { font-size: 16px; }
  .ytLbl svg { width: 24px; height: 17px; }
  .am { padding: 12px; gap: 12px; } .cover { width: 96px; height: 96px; } .song { font-size: 22px; margin-top: 4px; } .artist { font-size: 17px; }
  .chip { font-size: 13px; padding: 6px 7px; } .ctrls { gap: 10px; } .ctrls svg { width: 34px; height: 34px; } .dots { display: none; }
  .play { width: 46px; height: 46px; } .play svg { width: 18px; height: 18px; }
  .icons { gap: 16px; } .icons svg { height: 46px; } .stats { font-size: 22px; gap: 14px; } .stat svg { width: 30px; height: 30px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  setBg(CONFIG.background);

  $("shade").value = Math.round(CONFIG.backgroundDarkness * 100);
  pic("pfp", CONFIG.profilePicture); pic("ytPic", CONFIG.youtube.picture);
  $("ytLink").href = CONFIG.youtube.url; $("ytName").textContent = CONFIG.youtube.name;
  $("subs").textContent = CONFIG.youtube.subscribers ? CONFIG.youtube.subscribers + " SUBSCRIBERS" : CONFIG.youtube.handle;
  $("song").textContent = CONFIG.song.title; $("artist").textContent = CONFIG.song.artist;
  $("amAdd").href = CONFIG.song.appleMusic;
  if (CONFIG.song.cover) pic("cover", CONFIG.song.cover); else drawCover();
  if (CONFIG.song.preview) $("audio").src = CONFIG.song.preview;
  $("icons").innerHTML = CONFIG.socials.map(([k, u]) =>
    `<a href="${u}" target="_blank" rel="noopener" aria-label="${LABEL[k]}">${ICONS[k] || ""}</a>`).join("");
  $("views").textContent = CONFIG.views; if (!CONFIG.views) $("viewsStat").style.display = $("viewsSep").style.display = "none"; $("loc").textContent = CONFIG.location;
}

/* the album art until you add the real cover: the album's big lowercase "e" */
function drawCover() {
  const c = document.createElement("canvas"); c.width = c.height = 280; const g = c.getContext("2d");
  g.fillStyle = "#f6f6f4"; g.fillRect(0, 0, 280, 280);
  g.fillStyle = "#111"; g.font = "500 300px Georgia, 'Times New Roman', serif"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText("♪", 140, 140);
  $("cover").style.backgroundImage = `url(${c.toDataURL()})`;
}

/* typewriter: types each line, waits, deletes, next */
function typer() {
  const el = $("type"); let i = 0, j = 0, del = false;
  (function step() {
    const s = CONFIG.typed[i % CONFIG.typed.length];
    el.textContent = s.slice(0, j);
    if (!del && j < s.length) { j++; setTimeout(step, 85); }
    else if (!del) { del = true; setTimeout(step, 1900); }
    else if (j > 0) { j--; setTimeout(step, 40); }
    else { del = false; i++; setTimeout(step, 350); }
  })();
}

/* pink glitch specks around the name */
function specks() {
  const box = $("specks");
  for (let k = 0; k < 6; k++) {
    const s = document.createElement("i"), w = 2 + Math.random() * 3;
    s.style.cssText = `left:${-4 + Math.random() * 105}%;top:${-10 + Math.random() * 110}%;width:${w}px;height:${w}px;animation-delay:${Math.random() * 2.6}s`;
    box.appendChild(s);
  }
}


/* a soft mouse-click sound on every click (made on the fly, no file needed) */
let ctx;
function click() {
  if (!CONFIG.clickSound) return;
  try {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    const len = ctx.sampleRate * .035, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 6);
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), v = ctx.createGain();
    f.type = "bandpass"; f.frequency.value = 2400; v.gain.value = .5;
    src.buffer = buf; src.connect(f).connect(v).connect(ctx.destination); src.start();
  } catch (e) {}
}
addEventListener("pointerdown", click);

/* song: plays your preview if you set one, otherwise opens Apple Music */
const PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>', PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>';
$("play").addEventListener("click", () => {
  const a = $("audio");
  if (!a.getAttribute("src")) { location.href = CONFIG.song.appleMusic; return; }
  if (a.paused) a.play().catch(() => {}); else a.pause();
});
$("audio").addEventListener("play", () => { $("am").classList.add("playing"); $("play").innerHTML = PAUSE; });
$("audio").addEventListener("pause", () => { $("am").classList.remove("playing"); $("play").innerHTML = PLAY; });
$("audio").addEventListener("timeupdate", (e) => { const a = e.target; if (a.duration) $("prog").style.width = (100 * a.currentTime / a.duration) + "%"; });

/* finds the song on Apple Music: its 30-second preview and cover art */
function loadSong() {
  if (CONFIG.song.preview && CONFIG.song.cover) return;
  const cb = "song" + Date.now();
  window[cb] = (data) => {
    delete window[cb];
    const want = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, "");
    const r = (data.results || []).find((t) => want(t.trackName) === want(CONFIG.song.title) && want(t.artistName).includes(want(CONFIG.song.artist)))
      || (data.results || [])[0];
    if (!r) return;
    if (!CONFIG.song.preview && r.previewUrl) $("audio").src = r.previewUrl;
    if (!CONFIG.song.cover && r.artworkUrl100) pic("cover", r.artworkUrl100.replace("100x100", "600x600"));
    if (r.trackViewUrl) $("amAdd").href = CONFIG.song.appleMusic = r.trackViewUrl;
    if (document.body.classList.contains("in")) $("audio").play().catch(() => {});
  };
  const sc = document.createElement("script");
  sc.src = (CONFIG.song.trackId ? "https://itunes.apple.com/lookup?country=us&id=" + CONFIG.song.trackId : "https://itunes.apple.com/search?entity=song&limit=10&country=us&term=" + encodeURIComponent(CONFIG.song.search)) + "&callback=" + cb;
  sc.onerror = () => delete window[cb];
  document.head.appendChild(sc);
}
$("audio").volume = 0.6;

/* click to enter: also starts the song, like your guns.lol page */
function enter() {
  $("enter").classList.add("gone"); document.body.classList.add("in");
  if ($("audio").getAttribute("src")) $("audio").play().catch(() => {});
}
$("enter").addEventListener("click", enter);
$("enter").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") enter(); });

/* edit panel */
$("editBtn").addEventListener("click", () => $("panel").classList.add("open"));
$("closePanel").addEventListener("click", () => $("panel").classList.remove("open"));
const url = (inp) => inp.files[0] ? URL.createObjectURL(inp.files[0]) : "";
$("fBg").addEventListener("change", (e) => { const f = e.target.files[0]; if (f) setBg(URL.createObjectURL(f), f.type.startsWith("video")); });
$("fPfp").addEventListener("change", (e) => pic("pfp", url(e.target)));
$("fYt").addEventListener("change", (e) => pic("ytPic", url(e.target)));
$("fCover").addEventListener("change", (e) => pic("cover", url(e.target)));
$("fAudio").addEventListener("change", (e) => { const u = url(e.target); if (u) $("audio").src = u; });
$("shade").addEventListener("input", (e) => document.documentElement.style.setProperty("--shade", e.target.value / 100));

apply(); typer(); specks(); loadSong();
</script>
